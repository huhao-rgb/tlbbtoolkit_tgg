name: CI

# 每次 PR / 合入 main 都跑一遍质量门禁：
# 依赖锁定、生成物与源码一致、格式、静态检查、测试、架构边界。
# 发布流水线（release.yml 等）只在打 tag 时构建，不能替代这里。
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: 静态检查与测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 必须与 pubspec.lock 中记录的 source 一致，否则 pub 会判定 lock 失效
      # 并整体重新解析依赖（v1.1.2 黑屏事故的起因）。
      PUB_HOSTED_URL: https://pub.dev

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: 拉取依赖（锁定版本）
        run: flutter pub get --enforce-lockfile

      - name: 拉取安装器依赖（嵌套工程）
        # installer/ 是带独立 pubspec.yaml 的工程，但根目录跑 flutter analyze 时
        # 会连它一起分析。缺 .dart_tool 时 package:tiangongge_installer/... 全部
        # 解析失败，一次性报出几百条 undefined_* 假错误（看起来像代码写错了）。
        working-directory: installer
        run: flutter pub get --enforce-lockfile

      - name: 重新生成代码
        # --delete-conflicting-outputs：provider / 路由改名或删除时旧产物会冲突，
        # 带上它 CI 才能自愈重生成，而不是抛 "conflicting outputs" 误导排查。
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 校验生成物已入库
        # 改了实体 / provider / 路由 / 资源却没重跑 build_runner 时，这里会失败。
        #
        # 用 git status 而不是 git diff：新增 provider / 路由时会生成**新的**
        # ‹名称›.g.dart，git diff 只看已跟踪文件，看不到未 add 的新生成文件。
        # 同时把实际差异打出来，省得去翻日志猜是哪个文件哪一行。
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::生成物与源码不一致，请在本地运行 fvm dart run build_runner build 后一并提交"
            {
              echo '## 生成物与源码不一致'
              echo '```'
              echo "==== 变更文件 ===="
              git status --porcelain
              echo "==== 具体差异（最多 300 行）===="
              git diff | head -300
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: 格式检查
        run: dart format --output=none --set-exit-if-changed lib test

      - name: 静态检查
        run: flutter analyze

      - name: 架构边界检查
        run: python3 scripts/check_feature_boundaries.py

      - name: 单元 / Widget 测试
        run: flutter test
