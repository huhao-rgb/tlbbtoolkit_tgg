name: macOS Release

# 手动触发、macOS 相关文件变更，或推送 v* tag 时构建 macOS DMG。
# 当前不签名、不公证（没有 Apple Developer 账号），用户首次打开需手动放行。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '把产物附加到哪个已有 Release（留空则只跑构建，例如 v1.1.2）'
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'scripts/build_macos_dmg.sh'
      - 'scripts/macos_dmg_readme.txt'
      - 'macos/**'
      - '.github/workflows/macos-release.yml'

permissions:
  contents: write # 创建 Release 并上传附件

jobs:
  build-macos:
    name: 构建 macOS DMG
    runs-on: macos-latest
    env:
      # 必须与 pubspec.lock 中记录的 source 一致，避免 pub 静默重解析依赖。
      PUB_HOSTED_URL: https://pub.dev
      # CI 里没有 fvm，脚本用 flutter
      FLUTTER_BIN: flutter
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与 fvm_config.json 锁定版本一致
          flutter-version: '3.47.0'
          cache: true

      - name: 拉取依赖
        run: flutter pub get --enforce-lockfile

      - name: 构建并打包 DMG
        env:
          # 云同步地址是**编译期**常量（String.fromEnvironment），必须在这里注入，
          # 否则打出的 macOS 包云同步入口会被隐藏。脚本会在构建后做字节级校验。
          SYNC_BASE_URL: ${{ vars.SYNC_BASE_URL }}
          # 有证书时填这两个仓库变量即可自动签名/公证，无需改脚本。
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ vars.MACOS_NOTARY_PROFILE }}
        run: bash scripts/build_macos_dmg.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: TiangongGe-macOS
          path: dist/*.dmg
          retention-days: 14

      # tag 推送时把 DMG 附到 GitHub Release。
      # Release 由 Android 流水线（release.yml）创建，这里先等它出现再上传，
      # 超时仍未出现才自己创建（避免多个流水线同时 create 报 422）。
      - name: 附加到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          repo="${GITHUB_REPOSITORY}"
          echo "目标 Release：${tag}"

          exists=0
          for i in $(seq 1 40); do
            if gh release view "${tag}" --repo "${repo}" >/dev/null 2>&1; then
              exists=1
              break
            fi
            echo "等待 Release ${tag} 创建…（${i}/40）"
            sleep 15
          done

          if [ "${exists}" -eq 0 ]; then
            echo "::warning::Release ${tag} 仍未创建，按 CHANGELOG 自行创建"
            ver="$(sed -n 's/^version: //p' pubspec.yaml | head -1)"
            ver="${ver%%+*}"
            awk -v ver="${ver}" '
              /^## \[/ {
                line = $0
                sub(/^## \[/, "", line)
                sub(/\].*$/, "", line)
                in_section = (line == ver)
                if (in_section) print
                next
              }
              in_section { print }
            ' CHANGELOG.md > release-notes.md
            if [ ! -s release-notes.md ]; then
              echo "# ${tag}" > release-notes.md
            fi
            gh release create "${tag}" --repo "${repo}" --title "${tag}" --notes-file release-notes.md
          fi

          shopt -s nullglob
          files=(dist/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::dist 中没有可上传的产物"
            exit 1
          fi
          gh release upload "${tag}" --repo "${repo}" --clobber "${files[@]}"
          echo "已附加到 Release ${tag}：${files[*]}"
