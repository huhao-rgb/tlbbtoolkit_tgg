name: Installer Release

# 手动触发、安装器目录变更，或推送 v* tag 时构建 Windows 安装器。
# 产物为安装器目录 zip 与单文件 Setup.exe。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '把产物附加到哪个已有 Release（留空则只跑构建，例如 v1.1.2）'
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'installer/**'
      - '.github/workflows/installer-release.yml'

permissions:
  contents: write # 创建 Release 并上传附件

jobs:
  build-installer:
    name: 构建 Windows 安装器
    runs-on: windows-latest
    env:
      # 必须与 pubspec.lock 中记录的 source 一致，避免 pub 静默重解析依赖。
      PUB_HOSTED_URL: https://pub.dev
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与 fvm_config.json 锁定版本一致
          flutter-version: '3.47.0'
          cache: true

      - name: 读取主工程版本号
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)' |
            Select-Object -First 1
          if (-not $match) { throw '无法从 pubspec.yaml 读取版本号' }
          $version = $match.Matches[0].Groups[1].Value
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "天工阁版本：$version"

      - name: 主程序依赖
        run: flutter pub get --enforce-lockfile

      - name: 构建主程序（Windows Release）
        # 云同步地址是**编译期**常量（String.fromEnvironment），必须在这里注入，
        # 否则打出的 Windows 包云同步入口会被隐藏。与 Android 流水线保持一致，
        # 读取仓库变量 vars.SYNC_BASE_URL。
        env:
          SYNC_BASE_URL: ${{ vars.SYNC_BASE_URL }}
        shell: pwsh
        run: |
          if ($env:SYNC_BASE_URL) {
            Write-Host "云同步地址：$env:SYNC_BASE_URL"
          } else {
            Write-Warning "未配置仓库变量 SYNC_BASE_URL —— 本次构建的包将不含云同步功能"
          }
          flutter build windows --release --dart-define=SYNC_BASE_URL="$env:SYNC_BASE_URL"
          if ($LASTEXITCODE -ne 0) { throw "主程序构建失败" }

          # 编译期常量一旦漏传不会有任何报错，只会静默隐藏云同步入口，
          # 所以在 app.so 里做一次字节级校验。
          if ($env:SYNC_BASE_URL) {
            $appSo = "build/windows/x64/runner/Release/data/app.so"
            if (-not (Test-Path $appSo)) { throw "找不到 $appSo" }
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $appSo))
            $needle = [System.Text.Encoding]::UTF8.GetBytes($env:SYNC_BASE_URL)
            $found = $false
            for ($i = 0; $i -le $bytes.Length - $needle.Length; $i++) {
              if ($bytes[$i] -ne $needle[0]) { continue }
              $hit = $true
              for ($j = 1; $j -lt $needle.Length; $j++) {
                if ($bytes[$i + $j] -ne $needle[$j]) { $hit = $false; break }
              }
              if ($hit) { $found = $true; break }
            }
            if (-not $found) { throw "SYNC_BASE_URL 未编入 app.so，打出的包将无法使用云同步" }
            Write-Host "校验通过：SYNC_BASE_URL 已编入 app.so"
          }

      - name: 安装器依赖
        working-directory: installer
        run: flutter pub get --enforce-lockfile

      - name: 打包 payload.zip
        working-directory: installer
        run: >
          dart run tool/package_payload.dart
          --input ../build/windows/x64/runner/Release
          --output assets/payload/payload.zip

      - name: 构建安装器
        working-directory: installer
        run: >
          flutter build windows --release
          --dart-define=APP_VERSION=${{ steps.version.outputs.value }}

      - name: 归档安装器目录
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive `
            -Path installer/build/windows/x64/runner/Release/* `
            -DestinationPath "dist/TiangongGe-Installer-${{ steps.version.outputs.value }}-win64.zip" `
            -Force

      - name: 安装 NSIS
        run: choco install nsis --no-progress -y

      - name: 封装单文件 Setup.exe
        working-directory: installer
        shell: pwsh
        run: |
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = "C:\Program Files\NSIS\makensis.exe" }
          if (-not (Test-Path $makensis)) { throw "未找到 makensis" }

          $source = (Resolve-Path "build\windows\x64\runner\Release").Path
          $icon = (Resolve-Path "windows\runner\resources\app_icon.ico").Path
          $out = Join-Path (Get-Location) "..\dist\TiangongGe-Setup-${{ steps.version.outputs.value }}-win64.exe"
          & $makensis "/DAPP_VERSION=${{ steps.version.outputs.value }}" "/DSOURCE_DIR=$source" "/DOUTPUT_FILE=$out" "/DICON_FILE=$icon" tool\setup_sfx.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis 失败" }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: TiangongGe-Installer-win64
          path: |
            dist/*.zip
            dist/*.exe
          retention-days: 14

      # tag 推送时把安装包附到 GitHub Release。
      # Release 由 Android 流水线（release.yml）创建，两边同时跑，先等它出现再上传，
      # 超时仍未出现才自己创建（避免两边同时 create 报 422）。
      - name: 附加到 GitHub Release
        # tag 推送 → 当前 tag；手动触发 → 输入的 release_tag（用于补传历史版本）。
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { "${{ github.ref_name }}" }
          $repo = $env:GITHUB_REPOSITORY
          Write-Host "目标 Release：$tag"

          $exists = $false
          for ($i = 0; $i -lt 40; $i++) {
            gh release view $tag --repo $repo 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { $exists = $true; break }
            Write-Host "等待 Release $tag 创建…（$($i + 1)/40）"
            Start-Sleep -Seconds 15
          }

          if (-not $exists) {
            Write-Host "Release $tag 仍未创建，按 CHANGELOG 自行创建" -ForegroundColor Yellow
            $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' | Select-Object -First 1
            $ver = if ($match) { $match.Matches[0].Groups[1].Value } else { $tag.TrimStart('v') }

            $notes = @()
            $inSection = $false
            foreach ($line in Get-Content CHANGELOG.md -Encoding utf8) {
              if ($line -match '^## \[(.+?)\]') {
                $inSection = ($Matches[1] -eq $ver)
                if ($inSection) { $notes += $line }
                continue
              }
              if ($inSection) { $notes += $line }
            }
            if ($notes.Count -eq 0) { $notes = @("# $tag") }
            $notes | Set-Content -Path release-notes.md -Encoding utf8
            gh release create $tag --repo $repo --title $tag --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败" }
          }

          $files = Get-ChildItem dist -File | Select-Object -ExpandProperty FullName
          if (-not $files) { throw "dist 中没有可上传的产物" }
          gh release upload $tag --repo $repo --clobber @files
          if ($LASTEXITCODE -ne 0) { throw "上传 Release 附件失败" }
          Write-Host "已附加到 Release $tag：$($files -join ', ')" -ForegroundColor Green
