name: Release

# 推送 v* 开头的 tag 时触发（由 scripts/release.sh 创建）
# workflow_dispatch 用于手动试跑：只构建 + 校验签名，不创建 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 需要

jobs:
  build-and-release:
    name: 构建 Release APK 并发布
    runs-on: ubuntu-latest
    env:
      # 必须与 pubspec.lock 中记录的 source 一致，否则 pub 会判定 lock 失效并
      # **整体重新解析依赖**，静默升级到新版本（v1.1.2 黑屏事故的起因）。
      PUB_HOSTED_URL: https://pub.dev
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与 fvm_config.json 锁定的版本保持一致
          flutter-version: '3.47.0'
          cache: true

      - name: 拉取依赖
        # --enforce-lockfile：lock 与 pubspec.yaml / 当前 pub 源不一致时立即失败，
        # 而不是静默重新解析。依赖漂移往往只在 release 包（R8 混淆）里才炸，
        # 提前失败远好过发一个启动黑屏的包。
        run: flutter pub get --enforce-lockfile

      - name: 代码生成（安全校验，产物应与入库文件一致）
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 还原正式签名 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            value=""
            case "$name" in
              KEYSTORE_BASE64)       value="$KEYSTORE_BASE64" ;;
              ANDROID_STORE_PASSWORD) value="$ANDROID_STORE_PASSWORD" ;;
              ANDROID_KEY_ALIAS)     value="$ANDROID_KEY_ALIAS" ;;
              ANDROID_KEY_PASSWORD)  value="$ANDROID_KEY_PASSWORD" ;;
            esac
            if [ -z "$value" ]; then
              echo "::error::缺少 Secrets 配置：$name"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::keystore 解码为空，请检查 ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "keystore 已还原到 $RUNNER_TEMP/release.jks（仅本次运行可见）"

      - name: 构建 Release APK
        env:
          # 云同步地址走仓库变量（Settings → Secrets and variables → Actions → Variables，
          # 名字 SYNC_BASE_URL，值形如 https://<envId>.service.tcloudbase.com）。
          # 未配置时展开为空串 → 客户端判定为「未配置云同步」并降级（不报错）。
          SYNC_BASE_URL: ${{ vars.SYNC_BASE_URL }}
          # 正式签名走 Secrets，永不以文件形式进入仓库。
          # Gradle 侧见 android/app/build.gradle.kts 的 signingValue()。
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$SYNC_BASE_URL" ]; then
            echo "云同步地址：$SYNC_BASE_URL"
          else
            echo "::warning::未配置仓库变量 SYNC_BASE_URL —— 本次构建的包将不含云同步功能"
          fi
          # --target-platform android-arm64：只打 arm64-v8a。
          # Flutter 默认把 arm64-v8a / armeabi-v7a / x86_64 三套引擎与 AOT 产物全部
          # 打进一个 APK（三套 .so 合计约 60 MB）。32 位真机与模拟器用的 x86_64
          # 没有实际用户，只保留 arm64 后 .so 约 20 MB。
          flutter build apk --release \
            --target-platform android-arm64 \
            --dart-define=SYNC_BASE_URL="$SYNC_BASE_URL"

      - name: 校验 APK 签名（防止误发 debug 包）
        env:
          # 可选：仓库变量 ANDROID_CERT_SHA256（冒号分隔的大写指纹），配置后额外校验
          # 证书指纹必须匹配，防止 Secrets 里换成了别的 keystore。
          EXPECTED_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::未找到 apksigner（$APKSIGNER）"
            exit 1
          fi

          SIG="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$SIG"

          if echo "$SIG" | grep -q "CN=Android Debug"; then
            echo "::error::APK 使用的是 debug 证书，请检查 Secrets（ANDROID_KEYSTORE_*）"
            exit 1
          fi

          if [ -n "$EXPECTED_SHA256" ]; then
            want="$(echo "$EXPECTED_SHA256" | tr -d ':' | tr 'a-f' 'A-F')"
            got="$(echo "$SIG" | grep 'certificate SHA-256 digest' | head -1 | awk -F': ' '{print $NF}' | tr -d ' ' | tr 'a-f' 'A-F')"
            if [ "$want" != "$got" ]; then
              echo "::error::证书指纹不匹配：期望 $want，实际 $got"
              exit 1
            fi
            echo "证书指纹校验通过：$got"
          fi

      - name: 提取本次版本更新日志
        run: |
          # tag 名是 v<主.次.修订>（不含构建号），而 CHANGELOG 小节带构建号
          # （## [1.1.2+9]）。版本号一律以本次 tag 提交里的 pubspec.yaml 为准；
          # 退回到 tag 名只用于 tag 名本身带构建号的情况。
          VER=$(sed -n 's/^version: //p' pubspec.yaml | head -1)
          if [ -z "$VER" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          echo "本次版本：$VER"

          # 按字面比较小节标题里的版本号（不走正则，避免 + . 等元字符误匹配），
          # 输出该小节内容直到下一个版本小节。
          awk -v ver="$VER" '
            /^## \[/ {
              line = $0
              sub(/^## \[/, "", line)
              sub(/\].*$/, "", line)
              in_section = (line == ver)
              if (in_section) print
              next
            }
            in_section { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "# ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          fi

      - name: 创建 GitHub Release
        # 只有推送 v* tag 才发布；workflow_dispatch 手动试跑仅构建与校验签名。
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true

      - name: 清理签名材料
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
