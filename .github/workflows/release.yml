name: Release

# 推送 v* 开头的 tag 时触发（由 scripts/release.sh 创建）
# workflow_dispatch 用于手动试跑：只构建 + 校验签名，不创建 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 需要

jobs:
  build-and-release:
    name: 构建 Release APK 并发布
    runs-on: ubuntu-latest
    env:
      # 必须与 pubspec.lock 中记录的 source 一致，否则 pub 会判定 lock 失效并
      # **整体重新解析依赖**，静默升级到新版本（v1.1.2 黑屏事故的起因）。
      PUB_HOSTED_URL: https://pub.dev
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与 fvm_config.json 锁定的版本保持一致
          flutter-version: '3.47.0'
          cache: true

      - name: 安装 JDK 21
        # Gradle 8.14 官方支持到 JDK 24；JDK 25 需要 Gradle 9.1+。
        # ubuntu-latest 的默认 JDK 已升到 25，不钉版本会在 assembleRelease 阶段
        # 直接报 "Java/Gradle incompatibility" 而失败。
        # 这里钉住 LTS 21（与本地开发环境一致）；将来若要上 JDK 25，
        # 需把 gradle-wrapper 一并升到 9.1+ 并回归 AGP 8.11 的兼容性。
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 让 Flutter 固定使用该 JDK
        # Flutter 读 JAVA_HOME，但 runner 上可能还装着 Android Studio 自带 JDK；
        # 显式写入 flutter 配置，避免两条取 JDK 的路径不一致时又落回系统默认。
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          java -version

      - name: 拉取依赖
        # --enforce-lockfile：lock 与 pubspec.yaml / 当前 pub 源不一致时立即失败，
        # 而不是静默重新解析。依赖漂移往往只在 release 包（R8 混淆）里才炸，
        # 提前失败远好过发一个启动黑屏的包。
        run: flutter pub get --enforce-lockfile

      - name: 代码生成（安全校验，产物应与入库文件一致）
        run: dart run build_runner build --delete-conflicting-outputs

      - name: 还原正式签名 keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            value=""
            case "$name" in
              KEYSTORE_BASE64)       value="$KEYSTORE_BASE64" ;;
              ANDROID_STORE_PASSWORD) value="$ANDROID_STORE_PASSWORD" ;;
              ANDROID_KEY_ALIAS)     value="$ANDROID_KEY_ALIAS" ;;
              ANDROID_KEY_PASSWORD)  value="$ANDROID_KEY_PASSWORD" ;;
            esac
            if [ -z "$value" ]; then
              echo "::error::缺少 Secrets 配置：$name"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::keystore 解码为空，请检查 ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "keystore 已还原到 $RUNNER_TEMP/release.jks（仅本次运行可见）"

      - name: 构建 Release APK
        env:
          # 云同步地址走仓库变量（Settings → Secrets and variables → Actions → Variables，
          # 名字 SYNC_BASE_URL，值形如 https://<envId>.service.tcloudbase.com）。
          # 未配置时展开为空串 → 客户端判定为「未配置云同步」并降级（不报错）。
          SYNC_BASE_URL: ${{ vars.SYNC_BASE_URL }}
          # 数据目录地址（同 SYNC_BASE_URL 的注入方式）；未配置时只用内置数据。
          # 与云同步同环境：未单独配置时复用 SYNC_BASE_URL（只需配一个）
          CATALOG_BASE_URL: ${{ vars.CATALOG_BASE_URL || vars.SYNC_BASE_URL }}
          # 正式签名走 Secrets，永不以文件形式进入仓库。
          # Gradle 侧见 android/app/build.gradle.kts 的 signingValue()。
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$SYNC_BASE_URL" ]; then
            echo "云同步地址：$SYNC_BASE_URL"
          else
            echo "::warning::未配置仓库变量 SYNC_BASE_URL —— 本次构建的包将不含云同步功能"
          fi
          if [ -n "$CATALOG_BASE_URL" ]; then
            echo "数据目录地址：$CATALOG_BASE_URL"
          else
            echo "::warning::未配置 SYNC_BASE_URL / CATALOG_BASE_URL —— 本次构建只用内置数据（不热更新）"
          fi
          # --target-platform android-arm64：只打 arm64-v8a。
          # Flutter 默认把 arm64-v8a / armeabi-v7a / x86_64 三套引擎与 AOT 产物全部
          # 打进一个 APK（三套 .so 合计约 60 MB）。32 位真机与模拟器用的 x86_64
          # 没有实际用户，只保留 arm64 后 .so 约 20 MB。
          flutter build apk --release \
            --target-platform android-arm64 \
            --dart-define=SYNC_BASE_URL="$SYNC_BASE_URL" \
            --dart-define=CATALOG_BASE_URL="$CATALOG_BASE_URL"

      # 交付名由 android/app/build.gradle.kts 的 renameApkArtifacts 生成
      # （TiangongGe-<版本>-arm64.apk）。万一命名任务没跑到，这里按同样规则补一份，
      # 保证 Release 里的包名始终有辨识度，而不是 app-release.apk。
      - name: 解析 APK 交付名
        id: apk
        run: |
          VER=$(sed -n 's/^version: //p' pubspec.yaml | head -1)
          NAME_VER=${VER%%+*}
          EXPECTED="build/app/outputs/flutter-apk/TiangongGe-${NAME_VER}-arm64.apk"

          if [ -f "$EXPECTED" ]; then
            APK="$EXPECTED"
          else
            FALLBACK="build/app/outputs/flutter-apk/app-release.apk"
            if [ ! -f "$FALLBACK" ]; then
              echo "::error::未找到 APK 产物（$FALLBACK）"
              exit 1
            fi
            echo "::warning::未找到 $EXPECTED，按约定重命名 $FALLBACK"
            mkdir -p dist
            APK="dist/TiangongGe-${NAME_VER}-arm64.apk"
            cp "$FALLBACK" "$APK"
          fi

          echo "APK=$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: 校验 APK 签名（防止误发 debug 包）
        env:
          # 可选：仓库变量 ANDROID_CERT_SHA256（冒号分隔的大写指纹），配置后额外校验
          # 证书指纹必须匹配，防止 Secrets 里换成了别的 keystore。
          EXPECTED_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          APK="${{ steps.apk.outputs.apk }}"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::未找到 apksigner（$APKSIGNER）"
            exit 1
          fi

          SIG="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$SIG"

          if echo "$SIG" | grep -q "CN=Android Debug"; then
            echo "::error::APK 使用的是 debug 证书，请检查 Secrets（ANDROID_KEYSTORE_*）"
            exit 1
          fi

          if [ -n "$EXPECTED_SHA256" ]; then
            # 容忍冒号、大小写与误粘的空格/换行（从设置页复制常带尾随空白）。
            want="$(echo "$EXPECTED_SHA256" | tr -d ':' | tr -d '[:space:]' | tr 'a-f' 'A-F')"
            got="$(echo "$SIG" | grep 'certificate SHA-256 digest' | head -1 | awk -F': ' '{print $NF}' | tr -d ' ' | tr 'a-f' 'A-F')"
            if [ "$want" != "$got" ]; then
              echo "::error title=证书指纹不匹配::期望 $want，实际 $got（Secrets 里的 keystore 已被更换？）"
              exit 1
            fi
            echo "证书指纹校验通过：$got"
            # ::notice 会落成 run 的 annotation，可在 API / 运行页直接确认「确实比对了」，
            # 而不只是「没有报错」。
            echo "::notice title=证书指纹校验通过::$got"
            echo "> ✅ 已比对证书指纹：\`$got\`" >> "$GITHUB_STEP_SUMMARY"
          else
            # 变量名填错、或误填进 Secrets 时 vars.* 为空，校验会被静默跳过 ——
            # 「以为在保护」比不保护更危险，必须显式告警。
            echo "::warning title=未配置 ANDROID_CERT_SHA256::本次未比对证书指纹，请确认变量建在 Settings → Secrets and variables → Actions → Variables"
            echo "> ⚠️ 未配置仓库变量 \`ANDROID_CERT_SHA256\`，本次**未比对**证书指纹；实际指纹为 \`$(echo "$SIG" | grep 'SHA-256 digest' | head -1 | awk -F': ' '{print $NF}')\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      # 把「证书指纹 + APK SHA-256」写进 Job Summary 与 Release 正文。
      # 动机：这两项是用户判断「包有没有被换过」的唯一依据，也是向厂商申诉误报时
      # 必须提交的材料。过去只打在 Actions 日志里（随日志过期消失），用户侧无从核对；
      # 本地重建的包因 --dart-define 与构建环境不同，哈希也必然与发行包不同，
      # 所以官方哈希只能由 CI 在打包后当场产出。
      - name: 记录校验信息（证书指纹 / APK SHA-256）
        run: |
          APK="${{ steps.apk.outputs.apk }}"
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)apksigner"
          SIG="$("$APKSIGNER" verify --print-certs "$APK")"

          DN="$(echo "$SIG" | grep 'certificate DN' | head -1 | sed 's/.*certificate DN: //')"
          CERT="$(echo "$SIG" | grep 'SHA-256 digest' | head -1 | awk -F': ' '{print $NF}' | tr -d ' ' | tr 'a-f' 'A-F')"
          CERT_COLON="$(echo "$CERT" | sed 's/../&:/g; s/:$//')"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(du -h "$APK" | cut -f1 | tr -d ' ')"
          NAME="$(basename "$APK")"
          VER="$(sed -n 's/^version: //p' pubspec.yaml | head -1)"

          for pair in "DN:$DN" "CERT:$CERT" "SHA:$SHA"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::未能解析 ${pair%%:*}，签名信息不完整"
              exit 1
            fi
          done

          # 1) Job Summary：跑完就能在 Actions 页面看到，不必翻日志
          {
            echo "### 产物校验信息"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | \`$VER\` |"
            echo "| 文件 | \`$NAME\`（$SIZE） |"
            echo "| SHA-256 | \`$SHA\` |"
            echo "| 签名证书 | \`$DN\` |"
            echo "| 证书 SHA-256 | \`$CERT_COLON\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          # 2) 校验和文件（随 Release 一起发布）
          mkdir -p dist
          echo "$SHA  $NAME" > dist/SHA256SUMS.txt

          # 3) 供后续步骤拼装 Release 正文
          {
            echo "APK_NAME=$NAME"
            echo "APK_VER=$VER"
            echo "APK_SHA256=$SHA"
            echo "APK_SIZE=$SIZE"
            echo "CERT_DN=$DN"
            echo "CERT_SHA256=$CERT_COLON"
          } >> "$GITHUB_ENV"

      - name: 提取本次版本更新日志
        run: |
          # tag 名是 v<主.次.修订>（不含构建号），而 CHANGELOG 小节带构建号
          # （## [1.1.2+9]）。版本号一律以本次 tag 提交里的 pubspec.yaml 为准；
          # 退回到 tag 名只用于 tag 名本身带构建号的情况。
          VER=$(sed -n 's/^version: //p' pubspec.yaml | head -1)
          if [ -z "$VER" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          echo "本次版本：$VER"

          # 按字面比较小节标题里的版本号（不走正则，避免 + . 等元字符误匹配），
          # 输出该小节内容直到下一个版本小节。
          awk -v ver="$VER" '
            /^## \[/ {
              line = $0
              sub(/^## \[/, "", line)
              sub(/\].*$/, "", line)
              in_section = (line == ver)
              if (in_section) print
              next
            }
            in_section { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "# ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          fi

      # 追加在「提取更新日志」之后：那一步用 `>` 整体重写正文，先写会被覆盖。
      - name: 把校验信息写入 Release 正文
        run: |
          {
            echo ""
            echo "---"
            echo ""
            echo "## 安装前请核对签名"
            echo ""
            echo "> 华为 / 荣耀 / 小米 / OPPO / vivo 的手机管家可能把这个包报成"
            echo "> \`Android.Virus.Gray.BulimiaTGen.*\`。这是腾讯病毒库针对「个人自签证书 +"
            echo "> 未上架应用商店」的启发式误报，不是扫到了恶意代码："
            echo "> 权限只有网络访问，无广告与统计 SDK，dex 内无动态加载/执行能力。"
            echo "> 详细说明与自查步骤见仓库 [\`docs/android-antivirus-false-positive.md\`](https://github.com/huhao-rgb/tlbbtoolkit_tgg/blob/main/docs/android-antivirus-false-positive.md)。"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 文件 | \`$APK_NAME\`（$APK_SIZE） |"
            echo "| SHA-256 | \`$APK_SHA256\` |"
            echo "| 签名证书 | \`$CERT_DN\` |"
            echo "| 证书 SHA-256 | \`$CERT_SHA256\` |"
            echo ""
            echo "核对下载是否完整（PowerShell / macOS / Linux）："
            echo ""
            echo '```bash'
            echo "# PowerShell"
            echo "Get-FileHash .\\$APK_NAME -Algorithm SHA256"
            echo "# macOS / Linux"
            echo "shasum -a 256 $APK_NAME    # 或 sha256sum $APK_NAME"
            echo '```'
            echo ""
            echo "> 自行用源码重建的包哈希会与上方不同（CI 注入了 \`--dart-define\`），"
            echo "> 请以本页数值为唯一基准。"
          } >> RELEASE_NOTES.md

      - name: 创建 GitHub Release
        # 只有推送 v* tag 才发布；workflow_dispatch 手动试跑仅构建与校验签名。
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ steps.apk.outputs.apk }}
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true

      - name: 清理签名材料
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
